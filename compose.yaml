name: logsight

services:
  db:
    image: postgres:17.7
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logsight}
      POSTGRES_DB: ${POSTGRES_DB:-logsight}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logsight} -d ${POSTGRES_DB:-logsight}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - logsight-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-logsight}:${POSTGRES_PASSWORD:-logsight}@db:5432/${POSTGRES_DB:-logsight}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - logsight-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - logsight-net

volumes:
  pgdata:

networks:
  logsight-net:
    driver: bridge
